name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    # Public repository: only trusted pushes and owner-triggered dispatch reach Golf.
    runs-on: [self-hosted, linux, x64, gofaster-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: npm pack (dry-run)
        run: npm pack --dry-run
