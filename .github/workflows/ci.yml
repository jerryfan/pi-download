name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: pi-download-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack:
    # Never run a public fork or a non-owner initiated event on the persistent Golf host.
    # DECOMMISSIONED: this repository is outside Design/downstream CI.
    # No self-hosted Golf worker and no GitHub-hosted fallback are authorized.
    # Explicitly choose a separate CI policy before re-enabling this job.
    if: ${{ false }}
    runs-on: ubuntu-latest # inert while job-level if=false; no hosted minutes used
    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: npm pack (dry-run)
        run: npm pack --dry-run
