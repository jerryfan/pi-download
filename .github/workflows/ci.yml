name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    # Never run a public fork or a non-owner initiated event on the persistent Golf host.
    if: ${{ github.actor == 'jerryfan' }}
    runs-on: [self-hosted, linux, x64, gofaster-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: npm pack (dry-run)
        run: npm pack --dry-run
