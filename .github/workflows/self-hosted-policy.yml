name: Self-hosted workflow policy

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/assert-self-hosted-workflows.py'
  workflow_dispatch:

concurrency:
  group: self-hosted-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    # DECOMMISSIONED: this repository is outside Design/downstream CI.
    # No self-hosted Golf worker and no GitHub-hosted fallback are authorized.
    # Explicitly choose a separate CI policy before re-enabling this job.
    if: ${{ false }}
    runs-on: ubuntu-latest # inert while job-level if=false; no hosted minutes used
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Enforce GoFaster-only execution
        run: python3 .github/scripts/assert-self-hosted-workflows.py
